<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gestão de Contatos</title>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<header class="cabecalho">
		<h1>Gestão de Contatos</h1>
		<p class="subtitulo">Cadastre, edite e organize seus contatos.</p>
	</header>

	<main class="conteudo">
		<!-- Formulário de cadastro / edição -->
		<section class="painel" aria-labelledby="titulo-formulario">
			<h2 id="titulo-formulario" class="titulo-secao">Novo contato</h2>

			<form id="form-contato" class="formulario" autocomplete="off" novalidate>
				<!-- guarda o id do contato em edição; vazio = novo cadastro -->
				<input type="hidden" id="contato-id">

				<div class="campo">
					<label for="nome">Nome</label>
					<input type="text" id="nome" name="nome" placeholder="Ex.: Maria Silva" required>
				</div>

				<div class="campo">
					<label for="email">E-mail</label>
					<input type="email" id="email" name="email" placeholder="Ex.: maria@email.com" required>
				</div>

				<div class="campo">
					<label for="telefone">Telefone</label>
					<input type="tel" id="telefone" name="telefone" placeholder="Ex.: (11) 99999-9999" required>
				</div>

				<div class="acoes-formulario">
					<button type="submit" id="btn-salvar" class="botao botao-primario">Adicionar</button>
					<button type="button" id="btn-cancelar" class="botao botao-secundario" hidden>Cancelar</button>
				</div>
			</form>
		</section>

		<!-- Busca e lista -->
		<section class="painel" aria-labelledby="titulo-lista">
			<div class="cabecalho-lista">
				<h2 id="titulo-lista" class="titulo-secao">Contatos</h2>
				<span id="contador" class="contador" aria-live="polite">0 contatos</span>
			</div>

			<div class="campo busca">
				<label for="busca" class="rotulo-busca">Buscar</label>
				<input type="search" id="busca" placeholder="Buscar por nome ou e-mail...">
			</div>

			<!-- A lista de contatos é gerada dinamicamente a partir do array -->
			<ul id="lista-contatos" class="lista-contatos"></ul>

			<!-- Mensagem de estado vazio / sem resultados -->
			<p id="estado-vazio" class="estado-vazio">Nenhum contato cadastrado ainda.</p>
		</section>
	</main>

	<footer class="rodape">
		<p>Trabalho 01 — Desenvolvimento Web · Dados salvos localmente (Local Storage)</p>
	</footer>

	<script src="app.js"></script>
</body>

</html>
